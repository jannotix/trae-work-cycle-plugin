name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write
  actions: read

env:
  CARGO_TERM_COLOR: always

jobs:
  binaries:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            binary: trae-cycle.exe
            archive: trae-cycle-windows-x64.zip
          - os: ubuntu-latest
            name: wsl-x64
            binary: trae-cycle
            archive: trae-cycle-wsl-x64.tar.gz
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: production
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: production
      - name: Build release binary
        run: cargo build --release --workspace --locked
      - name: Stage archive and smoke the extracted runtime
        shell: pwsh
        run: ../tools/archive-runtime.ps1 -Binary "target/release/${{ matrix.binary }}" -Platform "${{ matrix.name }}" -Output "${{ github.workspace }}/${{ matrix.archive }}"
      - uses: actions/upload-artifact@v4
        with:
          name: trae-cycle-${{ matrix.name }}
          path: ${{ github.workspace }}/${{ matrix.archive }}
          if-no-files-found: error

  package:
    name: Package, attest, publish
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/cycle-artifacts
          merge-multiple: true
      - name: Package with allowlist
        shell: pwsh
        run: |
          $assets = @(
            "${{ runner.temp }}/cycle-artifacts/trae-cycle-windows-x64.zip",
            "${{ runner.temp }}/cycle-artifacts/trae-cycle-wsl-x64.tar.gz"
          )
          ./tools/package.ps1 -Assets $assets
          ./tools/test-package-contract.ps1 -Dist ./dist
      - name: Verify provenance (manifest revision equals source revision)
        shell: pwsh
        run: ./tools/package.ps1 -Verify ./dist
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.zip
            dist/*.tar.gz
            dist/SBOM.cdx.json
            dist/THIRD-PARTY-NOTICES.md
      - name: Verify attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify dist/trae-work-cycle-plugin-*.zip --repo "${{ github.repository }}"
          gh attestation verify dist/trae-cycle-windows-x64.zip --repo "${{ github.repository }}"
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate-release-notes: true
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/SBOM.cdx.json
            dist/THIRD-PARTY-NOTICES.md
            dist/SHA256SUMS.txt
            dist/MANIFEST.json
